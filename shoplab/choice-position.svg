    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Cumulative positions of shopper choices and AI recommendations</dc:title>
    <dc:description>By page one in the randomized catalogue, 45.1% of matched human choices and 10.5% of model recommendations had appeared. Both cumulative shares reach 100% by page 13.</dc:description>
