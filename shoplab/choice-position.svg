 <title id="plot-title">Cumulative positions of shopper choices and AI recommendations</title>
 <desc id="plot-description">Across 1,093 matched choices, 45.1 percent of human selections and 10.5 percent of model recommendations appeared on page one. All products appeared by page thirteen.</desc>
 <title>Cumulative positions of shopper choices and AI recommendations</title>
